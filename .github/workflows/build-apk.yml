
name: Build Native Chemistry APK

on:
  workflow_dispatch:
  push:
    branches:
      - native-v1

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Verify content and installer
        run: |
          python3 scripts/test-installer.py
          python3 tools/validate_content.py

      - name: Build and verify
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest

      - name: Package final bundle
        run: python3 scripts/package-final.py

      - name: Upload final bundle
        uses: actions/upload-artifact@v4
        with:
          name: chemistry-lab-final
          path: dist/chemistry-lab-4.0.0-final.zip
          if-no-files-found: error

