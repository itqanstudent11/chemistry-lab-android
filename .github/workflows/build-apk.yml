
name: Build Native Chemistry APK

on:
  workflow_dispatch:
  push:
    branches:
      - native-v1
      - codex/chemistry-encyclopedia-v4-checkpoint
      - chemistry-v4-test-fix
  pull_request:
    branches:
      - native-v1

env:
  VERIFICATION_RUN_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Begin current verification
        run: python3 scripts/verification.py begin --run-id "$VERIFICATION_RUN_ID"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Verify content and installer
        run: |
          python3 scripts/test-verification.py
          python3 scripts/test-installer.py
          python3 tools/validate_content.py

      - name: Build and verify
        id: build_checks
        run: |
          ./gradlew --no-daemon --no-build-cache testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest

      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm

      - name: Test on Android API 24
        id: android_tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 24
          target: default
          arch: x86
          profile: pixel_2
          disable-animations: true
          script: bash scripts/run-device-verification.sh

      - name: Generate current verification report
        if: always()
        run: >-
          python3 scripts/verification.py report
          --run-id "$VERIFICATION_RUN_ID"
          --build-outcome "${{ steps.build_checks.outcome }}"
          --android-outcome "${{ steps.android_tests.outcome }}"
          --device "Android API 24 / x86 / GitHub hosted emulator"

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chemistry-verification
          path: |
            build/verification/
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/androidTests/connected/
            app/build/reports/lint-results-debug.html
          if-no-files-found: warn

      - name: Package final bundle
        run: python3 scripts/package-final.py

      - name: Upload final bundle
        uses: actions/upload-artifact@v4
        with:
          name: chemistry-lab-final
          path: dist/chemistry-lab-4.0.0-final.zip
          if-no-files-found: error

